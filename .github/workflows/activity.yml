name: Update README Every 5 Minutes

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Update README, commit, and push
        env:
          COMMIT_NAME: "Aeriss99"
          COMMIT_EMAIL: "linggaardyansyh1@gmail.com"
        run: |
          git config user.name "$COMMIT_NAME"
          git config user.email "$COMMIT_EMAIL"

          UPDATED_AT=$(TZ=Asia/Jakarta date '+%d-%m-%Y %H:%M:%S WIB')

          cat > README.md <<EOF
          # 🌱 lingz99

          My automated activity log.

          README updates every 5 minutes using GitHub Actions.

          **Last update:** ${UPDATED_AT}
          EOF

          git add README.md
          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "docs: update README timestamp"
          git push
